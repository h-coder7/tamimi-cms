name: tamimi-cms-frontend

services:
  web:
    image: node:20-alpine
    container_name: tamimi-cms-web
    working_dir: /app
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-9091}:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    env_file:
      - .env.local
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0", "-p", "3000"]

  npm:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    env_file:
      - .env.local
    entrypoint: ["npm"]
    profiles:
      - tools

volumes:
  web_node_modules:
